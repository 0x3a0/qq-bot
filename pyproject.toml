[project]
name = "qq-bot"
version = "0.1.0"
description = "QQ 官方机器人：群内触发「大盘」返回 A股/美股行业板块 treemap 热力图"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "resvg>=0.2.0",
    "affine>=2.4",
    "websockets>=14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
