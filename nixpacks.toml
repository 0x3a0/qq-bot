# Railway / Nixpacks 构建配置
#
# - 显式锁定 Node 22 LTS：代码用了 process.loadEnvFile（Node 20.12+）
#   以及内置 fetch / AbortSignal.timeout
# - 安装中文字体：resvg 在找不到字体时不会报错，只会画不出文字（静默故障），
#   容器默认镜像通常没有 CJK 字体
# - @resvg/resvg-js 自带 linux-x64-gnu 预编译二进制，无需额外系统依赖
# - 这个服务只连 QQ Gateway WebSocket，不监听端口，也就没有公网域名；
#   平台侧的配置（Variables、副本数等）见 README「部署到 Railway」
[phases.setup]
nixPkgs = ["nodejs_22", "noto-fonts-cjk-sans", "fontconfig"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node dist/index.js"
